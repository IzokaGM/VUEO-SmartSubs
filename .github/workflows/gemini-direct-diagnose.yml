name: Gemini Direct Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test same Gemini request outside Cloudflare
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const key = (process.env.GEMINI_API_KEY || '').trim()
          if (!key || key.length < 20) {
            console.error('Add GEMINI_API_KEY in repository Actions secrets first.')
            process.exit(1)
          }
          const model = 'gemini-3.5-flash-lite'
          const redact = value => String(value || '')
            .split(key).join('[redacted]')
            .replace(/AIza[A-Za-z0-9_-]+/g, '[redacted]')
            .replace(/https?:\/\/\S+/gi, '[URL redacted]')
            .replace(/[\u0000-\u001f\u007f]/g, ' ')
            .replace(/\s+/g, ' ').trim().slice(0, 300)
          try {
            // Match the current SmartSubs configure request exactly.
            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
              {
                method: 'POST',
                headers: { 'content-type': 'application/json', 'x-goog-api-key': key },
                body: JSON.stringify({ contents: [{ parts: [{ text: 'Reply with OK.' }] }],
                  generationConfig: { maxOutputTokens: 4 } }),
                signal: AbortSignal.timeout(20_000),
                redirect: 'error',
              }
            )
            let payload = {}
            try { payload = await response.json() } catch {}
            console.log('Origin: GitHub-hosted runner (outside Cloudflare)')
            console.log(`Model: ${model}`)
            console.log(`HTTP: ${response.status}`)
            if (response.ok) {
              console.log('RESULT: Google accepted the same validation request.')
              console.log('This confirms API access for this key/model from this runner; it does not verify subtitle translation or Cloudflare access.')
            } else {
              console.log(`API status: ${redact(payload?.error?.status) || 'not provided'}`)
              console.log(`Reason: ${redact(payload?.error?.message) || 'not provided'}`)
              console.log('RESULT: Google rejected the request from this runner too.')
              process.exitCode = 1
            }
          } catch (error) {
            console.error(error?.name === 'TimeoutError' ? 'RESULT: Request timed out.' : 'RESULT: Network request failed; no API verdict obtained.')
            process.exitCode = 1
          }
          JS
